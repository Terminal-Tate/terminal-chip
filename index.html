<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terminal Chip | TCHIP</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #000;
      color: #dfffda;
      font-family: "Share Tech Mono", monospace;
      overflow: hidden;
    }

    #matrix {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.14;
      z-index: 0;
    }

    .center {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .coin-button {
      width: min(360px, 78vw);
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      transition: transform 0.22s ease, filter 0.22s ease;
    }

    .coin-button:hover {
      transform: scale(1.035);
      filter: drop-shadow(0 0 26px rgba(57, 255, 20, 0.28));
    }

    .coin-button:active {
      transform: scale(0.98);
    }

    .coin {
      width: 100%;
      display: block;
      filter: drop-shadow(0 0 18px rgba(57, 255, 20, 0.16));
      animation: float 5s ease-in-out infinite;
    }

    .hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      color: rgba(223, 255, 218, 0.42);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-align: center;
      white-space: nowrap;
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(8px);
    }

    .modal-bg.open {
      display: flex;
    }

    .modal {
      width: min(430px, 100%);
      border: 1px solid rgba(57, 255, 20, 0.28);
      background: rgba(0, 8, 1, 0.94);
      padding: 26px;
      box-shadow: 0 0 42px rgba(57, 255, 20, 0.12);
    }

    .modal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    h1 {
      color: #92ff7a;
      font-size: 19px;
      letter-spacing: 0.12em;
      font-weight: 400;
    }

    .close {
      border: 0;
      background: transparent;
      color: rgba(223, 255, 218, 0.7);
      font-size: 26px;
      cursor: pointer;
      line-height: 1;
    }

    .text {
      color: rgba(223, 255, 218, 0.62);
      font-size: 13px;
      line-height: 1.55;
      margin-bottom: 18px;
    }

    form {
      display: grid;
      gap: 11px;
    }

    input {
      width: 100%;
      border: 1px solid rgba(57, 255, 20, 0.22);
      background: #000;
      color: #eaffdf;
      padding: 14px;
      font-family: "Share Tech Mono", monospace;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: rgba(57, 255, 20, 0.72);
    }

    input::placeholder {
      color: rgba(223, 255, 218, 0.32);
    }

    .submit {
      border: 1px solid rgba(57, 255, 20, 0.55);
      background: rgba(57, 255, 20, 0.12);
      color: #92ff7a;
      padding: 14px;
      font-family: "Share Tech Mono", monospace;
      font-size: 14px;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .submit:hover {
      background: rgba(57, 255, 20, 0.22);
    }

    .status {
      min-height: 18px;
      margin-top: 12px;
      color: #92ff7a;
      font-size: 12px;
      line-height: 1.4;
    }

    .small {
      margin-top: 12px;
      color: rgba(223, 255, 218, 0.34);
      font-size: 11px;
      line-height: 1.45;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @media (max-width: 520px) {
      .coin-button {
        width: min(310px, 82vw);
      }

      .hint {
        bottom: 20px;
        font-size: 11px;
      }

      .modal {
        padding: 22px;
      }
    }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>

  <main class="center">
    <button class="coin-button" id="openModal" aria-label="Join Terminal Chip list">
      <!-- Upload your coin image to GitHub with this exact file name -->
      <img class="coin" src="terminal-chip-coin.png" alt="Terminal Chip coin" />
    </button>
  </main>

  <div class="hint">CLICK THE CHIP</div>

  <div class="modal-bg" id="modalBg">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-top">
        <h1 id="modalTitle">TERMINAL CHIP LIST</h1>
        <button class="close" id="closeModal" type="button" aria-label="Close">×</button>
      </div>

      <p class="text">
        Leave your email and Solana wallet. This list is reviewed manually.
      </p>

      <!-- Replace YOUR_FORMSPREE_ID after creating a free Formspree form -->
      <form id="signupForm" action="https://api.web3forms.com/submit" method="POST">

  <input type="hidden" name="access_key" value="05642f65-c206-4309-8bb2-e7fb36a3355b">

  <input type="email" name="email" placeholder="EMAIL" required />

  <input type="text" name="wallet" placeholder="SOLANA WALLET" required />

  <button class="submit" type="submit">SUBMIT</button>

</form>
      <div class="status" id="status"></div>
      <p class="small">No automatic airdrop. No promise. Manual distribution only.</p>
    </section>
  </div>

  <script>
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    const fontSize = 15;
    const chars = "01";
    let width;
    let height;
    let columns;
    let drops;

    function resizeMatrix() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      columns = Math.floor(width / fontSize);
      drops = Array.from({ length: columns }, () => Math.random() * height / fontSize);
    }

    function drawMatrix() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.11)";
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = "rgba(57, 255, 20, 0.42)";
      ctx.font = fontSize + "px Share Tech Mono";

      for (let i = 0; i < drops.length; i++) {
        if (Math.random() > 0.55) {
          const text = chars[Math.floor(Math.random() * chars.length)];
          ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        }

        if (drops[i] * fontSize > height && Math.random() > 0.987) {
          drops[i] = 0;
        }

        drops[i] += 0.62;
      }
    }

    resizeMatrix();
    setInterval(drawMatrix, 65);
    window.addEventListener("resize", resizeMatrix);

    const modalBg = document.getElementById("modalBg");
    const openModal = document.getElementById("openModal");
    const closeModal = document.getElementById("closeModal");

    openModal.addEventListener("click", () => {
      modalBg.classList.add("open");
    });

    closeModal.addEventListener("click", () => {
      modalBg.classList.remove("open");
    });

    modalBg.addEventListener("click", (event) => {
      if (event.target === modalBg) {
        modalBg.classList.remove("open");
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        modalBg.classList.remove("open");
      }
    });

    const form = document.getElementById("signupForm");
    const statusBox = document.getElementById("status");

    form.addEventListener("submit", async (event) => {
  event.preventDefault();

  statusBox.textContent = "SENDING...";

  const formData = new FormData(form);
  const object = Object.fromEntries(formData);
  const json = JSON.stringify(object);

  try {
    const response = await fetch("https://api.web3forms.com/submit", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Accept: "application/json"
      },
      body: json
    });

    const result = await response.json();

    if (result.success) {
      statusBox.textContent = "RECEIVED.";
      form.reset();
    } else {
      statusBox.textContent = "ERROR.";
    }

  } catch (error) {
    statusBox.textContent = "NETWORK ERROR.";
  }
});
  </script>
</body>
</html>
